# 读取方：MoveIt 执行管理器。这里只描述下游控制器 Action 的名称和关节映射，
# 不创建控制器；真正的 ros2_control 配置位于 serial_driver/config/ros2_controllers.yaml。
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_simple_controller_manager:
  controller_names: [arm_controller, gripper_controller]
  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [link_1_joint, link_2_joint, link_3_joint, link_4_joint, link_5_joint, link_6_joint]
  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [gripper_state_joint]
trajectory_execution:
  allowed_execution_duration_scaling: 1.5
  allowed_goal_duration_margin: 1.0
  allowed_start_tolerance: 0.01
