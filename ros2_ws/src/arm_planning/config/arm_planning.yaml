arm_planning:
  ros__parameters:
    # 输入：eng_interfaces/action/PlanMotion，目标客户端为调用方
    planning_action: /arm_planning/plan_motion
    # 请求 MoveIt 获取完整规划场景：moveit_msgs/srv/GetPlanningScene
    scene_service: /get_planning_scene
    # 输出给 RViz 的预览轨迹：moveit_msgs/msg/DisplayTrajectory
    display_topic: /arm_planning/display_planned_path

    # 以下名称必须与 SRDF、URDF、OMPL 配置一致
    planning_group: arm_control
    end_effector_link: link_6
    planning_pipeline: ompl
    planner_id: RRTConnectkConfigDefault
    reference_frames: [world, base_link]
    joint_tolerance: 0.0001

    # 多种子 IK 与轨迹插值复查，角度为 rad，时间为 s
    ik_attempts: 12
    ik_timeout: 0.05
    validation_step_rad: 0.01

    # Action 对应字段为 0 时采用这些值，非零请求值优先
    default_velocity_scaling: 0.2
    default_acceleration_scaling: 0.2
    default_planning_time: 5.0
