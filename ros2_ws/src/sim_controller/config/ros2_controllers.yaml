# 读取方：ros2_control 的 controller_manager 及其控制器。
# joint_state_broadcaster 发布 /joint_states；arm_controller 提供 FollowJointTrajectory Action。
controller_manager:
  ros__parameters:
    update_rate: 100 # 样条插值
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
arm_controller:
  ros__parameters:
    joints: [link_1_joint, link_2_joint, link_3_joint, link_4_joint, link_5_joint, link_6_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      goal_time: 1.0
