controller_manager:
  ros__parameters:
    update_rate: 100 # 控制器更新；串口发送频率独立由 tx_rate 控制
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
arm_controller:
  ros__parameters:
    joints: [link_1_joint, link_2_joint, link_3_joint, link_4_joint, link_5_joint, link_6_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.01
      link_1_joint: {trajectory: 0.2, goal: 0.1}
      link_2_joint: {trajectory: 0.2, goal: 0.1}
      link_3_joint: {trajectory: 0.2, goal: 0.1}
      link_4_joint: {trajectory: 0.2, goal: 0.1}
      link_5_joint: {trajectory: 0.2, goal: 0.1}
      link_6_joint: {trajectory: 0.2, goal: 0.1}

gripper_controller:
  ros__parameters:
    joints: [gripper_state_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    constraints:
      goal_time: 1.0
      # 串口联调期间仅执行夹爪轨迹，暂不按实测开合位置判定成败。
      # gripper_state_joint: {trajectory: 0.01, goal: 0.0001}
      gripper_state_joint: {trajectory: 0.0, goal: 0.0}
