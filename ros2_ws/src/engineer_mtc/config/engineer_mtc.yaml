engineer_mtc:
  ros__parameters:
    pose_topic: /vision/icp/object_poses # 默认在camera_link下               
    target_index: 0
    max_target_age: 1.5 # s
    max_joint_age: 1.0 # s
    hardware_status_timeout: 0.1 # s，执行须有新鲜硬件状态且 mode=2

    base_frame: base_link
    planning_group: arm_control
    tip_link: link_6 # 当前规划末端link_6
    planning_pipeline: ompl
    planner_id: RRTConnectkConfigDefault
    planning_time: 5.0 # s，规划预算
    max_ik_solutions: 8 # 候选解数量
    velocity_scaling: 0.2
    acceleration_scaling: 0.2

    # 抓取点相对 PLY 原点的位姿
    object_to_tcp_xyz: [0.0, 0.0, 0.0] # m
    object_to_tcp_rpy: [0.0, 0.0, 0.0] # rad
    # TCP 相对 link_6 的位姿
    tip_to_tcp_xyz: [0.0, 0.0, 0.0]
    tip_to_tcp_rpy: [0.0, 0.0, 0.0]
    approach_axis: [1.0, 0.0, 0.0] # 预抓取接近方向
    pregrasp_distance: 0.07 # m
    include_approach: true # 写 true 即可
    cartesian_step: 0.005 # m，直线插值步长

    # auto 连续执行；step 每阶段完成后等待
    execution_mode: auto
    gripper_group: gripper
    object_id: energy
    touch_links: [link_6]
    # T_PLY_energy：离线模型之间的变换
    object_to_energy_xyz: [0.000734246038, -0.001457943306, 0.004333127084]
    object_to_energy_rpy: [3.139041892859, -0.000000116949, -0.000003732359]
    extraction_axis: [0.0, 0.0, 1.0] 
    extraction_distance: 0.10 # m
    storage_distance: 0.10 # 预存矿沿存矿坐标系的+Z偏移
    retreat_distance: 0.07 # 松爪后沿TCP接近方向的反向退出
    # 仅模拟占位
    storage_xyz: [0.25, 0.20, 0.35] 
    storage_rpy: [0.0, 0.0, 0.0]
