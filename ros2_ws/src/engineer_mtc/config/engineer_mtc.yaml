engineer_mtc:
  ros__parameters:
    pose_topic: /vision/icp/object_poses # 默认在camera_link下               
    # 输入统一为 URDF energy_link 原点和轴向的位姿；header.frame_id 仍是相机或基座。
    target_index: 0
    target_average_samples: 5 # 最近连续有效位姿取平均；1 恢复单帧，修改后重启 MTC
    target_average_max_age: 5.0 # 平均窗口历史样本最大年龄，秒；适配低帧率静止取样
    max_target_age: 1.5 # 最新视觉观测有效期，秒
    max_joint_age: 1.0 # s
    hardware_status_timeout: 0.2 # s，执行须有新鲜硬件状态且 mode=2

    base_frame: base_link
    planning_group: arm_control
    tip_link: link_6 # 当前规划末端link_6
    planning_pipeline: ompl
    planner_id: RRTConnectkConfigDefault
    planning_time: 5.0 # s，规划预算
    max_ik_solutions: 10 # 存矿 IK 候选解上限及 OMPL 规划尝试次数
    pick_max_ik_solutions: 20 # 取矿预抓取 IK 候选解上限
    velocity_scaling: 0.2
    acceleration_scaling: 0.7

    # URDF energy_link -> TCP。TCP 局部 X 保持接近方向，TCP +Z 对齐矿 PLY -Z。
    object_to_tcp_xyz: [-0.000734251986318, -0.001468988580768, 0.004329394048142] # m
    object_to_tcp_rpy: [0.002550760731211, -0.000000107428275, -0.000003732645167] # rad
    # TCP 相对 link_6 的位姿
    tip_to_tcp_xyz: [0.12, 0.0, 0.0] # TCP 沿 link_6 正 X 偏移 12 cm
    tip_to_tcp_rpy: [0.0, 0.0, 0.0]
    approach_axis: [1.0, 0.0, 0.0] # 预抓取接近方向
    pregrasp_distance: 0.12 # m
    include_approach: true # 写 true 即可
    cartesian_step: 0.005 # m，直线插值步长

    # auto 连续执行；step 每阶段完成后等待
    execution_mode: auto
    gripper_group: gripper
    object_id: energy
    touch_links: [link_6] # 夹取和带矿时允许接触目标矿的 link
    # 拉取轴在 URDF 中约为 -Z（朝大头），由原 PLY +Z 精确转换而来。
    extraction_axis: [0.000000116949, 0.002550757964758, -0.999996746811604]
    extraction_distance: 0.15 # m
    storage_insertion_axis: [0.0, 0.0, -1.0] # 基座坐标系下的入槽方向
    # storage_contact_objects: [slot_contact_surface] # 启用前确认 ID 已在场景中
    storage_distance: 0.10 # 沿入槽方向直线移动的距离，m
    retreat_distance: 0.07 # 松爪后沿TCP接近方向的反向退出
    # 目标为矿块原点，link_6 位姿按夹持关系换算。
    storage_xyz: [-0.277770576390778, 0.230947485257963, 0.19]
    # URDF +Z 指向小头；绕 X 翻转使小头朝下。
    storage_rpy: [3.141592653589793, 0.0, 2.09439510]
