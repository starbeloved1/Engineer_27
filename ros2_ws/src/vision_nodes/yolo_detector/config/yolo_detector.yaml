yolo_detector:
  ros__parameters:
    use_manual_roi: true # 是否启用手动 roi
    model_path: model/best.pt
    color_topic: /camera/camera/color/image_raw
    detection_topic: /vision/yolo/detections
    visualization_topic: /vision/visualization/image # 可视化
    visualization_rate_hz: 0.0 # 跟随检测结果
    conf_thres: 0.5
    iou_thres: 0.45
    device: gpu # 填入gpu或者cpu
    imgsz: 640 # yolo 输入
    log_every_n: 30
    input_reliability: reliable
