yolo_detector:
  ros__parameters:
    use_manual_roi: false # 是否启用手动 roi
    auto_lock_detection: true # 首次有效检测后锁定框；仅适用于静止目标
    locked_detection_rate_hz: 10.0 # 锁定后更新当前图像与框的频率
    model_path: model/best1.pt
    color_topic: /camera/camera/color/image_raw
    detection_topic: /vision/yolo/detections
    visualization_topic: /vision/visualization/image # 可视化
    overlay_cloud_enabled: true
    overlay_cloud_topic: /vision/icp/aligned_cloud # ICP 模型投影，橙红色
    overlay_camera_info_topic: /camera/camera/color/camera_info
    overlay_cloud_max_age: 1.5 # 与图像采集时间差上限，秒
    overlay_cloud_max_points: 3000 # 仅限制显示，不影响 ICP
    overlay_cloud_radius: 1 # 投影点半径，像素
    visualization_jpeg_quality: 80 # 远程图像 JPEG 质量，1~100
    visualization_rate_hz: 0.0 # 跟随检测结果
    conf_thres: 0.7
    iou_thres: 0.45
    device: gpu # 填入gpu或者cpu
    imgsz: 640 # yolo 输入
    log_every_n: 30
    input_reliability: reliable
