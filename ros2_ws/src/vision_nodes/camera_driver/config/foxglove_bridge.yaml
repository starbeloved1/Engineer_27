foxglove_bridge:
  ros__parameters:
    address: 0.0.0.0
    port: 8765
    # 相机、视觉、坐标变换和串口联调状态
    topic_whitelist:
      - ^/camera/.*
      - ^/vision/.*
      - ^/tf$
      - ^/tf_static$
      - ^/arm_controller/controller_state$
      - ^/gripper_controller/controller_state$
      - ^/serial_driver/status$
    min_qos_depth: 1
    max_qos_depth: 1
